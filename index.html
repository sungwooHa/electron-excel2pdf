<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Excel to PDF Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #fileList {
            list-style-type: none;
            padding: 0;
        }
        #fileList li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .progress {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel to PDF Converter</h1>
        <button id="selectFiles">Select Excel Files</button>
        <button id="convertToPdf" disabled>Convert to PDF</button>
        <div class="progress" id="progress">Converting files...</div>
        <ul id="fileList"></ul>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
